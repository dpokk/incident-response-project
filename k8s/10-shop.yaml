# The "production" application under investigation: frontend -> backend (2 replicas) -> PostgreSQL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: shop
data:
  CPU_WORK_MS: "1.5"            # CPU-milliseconds of work per request
  REQUEST_BUFFER_KB: "256"    # memory held per in-flight request
  WORKER_THREADS: "2"
  READY_MAX_INFLIGHT: "300"   # readiness fails above this backlog
  BACKLOG_WARN_INFLIGHT: "100"
  MEMORY_WARN_RATIO: "0.8"
  STATS_INTERVAL_S: "2"
  DATABASE_URL: "postgresql://shop@postgres:5432/shop"   # password comes from the postgres-credentials Secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shop
  labels: {app: backend, tier: api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend, tier: api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: backend
          image: incident-demo/app:0.2
          imagePullPolicy: Never
          command: ["python", "backend.py"]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: SERVICE_NAME, value: backend}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}}
          envFrom:
            - configMapRef: {name: backend-config}
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: 500m, memory: 192Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: shop
  labels: {app: backend}
spec:
  selector: {app: backend}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop
  labels: {app: frontend, tier: edge}
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend, tier: edge}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: frontend
          image: incident-demo/app:0.2
          imagePullPolicy: Never
          command: ["python", "frontend.py"]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: SERVICE_NAME, value: frontend}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: BACKEND_URL, value: "http://backend.shop.svc.cluster.local:8080"}
            - {name: UPSTREAM_TIMEOUT_S, value: "3"}
          resources:
            requests: {cpu: 200m, memory: 128Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shop
  labels: {app: frontend}
spec:
  selector: {app: frontend}
  ports:
    - {name: http, port: 8080, targetPort: http}
